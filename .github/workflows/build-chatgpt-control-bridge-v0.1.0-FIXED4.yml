name: Build ChatGPT Control Bridge APK — FIXED4

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ChatGPT Control Bridge APK FIXED4
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Prepare EXACT FIXED4 source
        id: project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf source
          ZIP="./ChatGPT_Control_Bridge_v0.1.0_FIXED4.zip"
          if [ ! -f "$ZIP" ]; then
            echo "ERROR: exact FIXED4 ZIP is missing: $ZIP"
            echo "Available Bridge ZIPs:"
            find . -maxdepth 1 -type f -name 'ChatGPT_Control_Bridge*.zip' -print | sort
            exit 1
          fi
          echo "Using EXACT source: $ZIP"
          mkdir -p source
          unzip -q "$ZIP" -d source
          SETTINGS_FILE=$(find source -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) -print -quit)
          test -n "$SETTINGS_FILE"
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          test -f "$PROJECT_DIR/app/src/main/java/com/example/chatgptbridge/MainActivity.java"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Static FIXED4 checks
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'com.openai.chatgpt' app/src/main/AndroidManifest.xml
          grep -q 'com.openai.chatgpt' app/src/main/java/com/example/chatgptbridge/MainActivity.java
          grep -q 'FIXED4' app/src/main/java/com/example/chatgptbridge/MainActivity.java
          grep -q 'getLaunchIntentForPackage' app/src/main/java/com/example/chatgptbridge/MainActivity.java
          grep -q 'queryIntentActivities' app/src/main/java/com/example/chatgptbridge/MainActivity.java
          grep -q 'x.contains("вверх")' app/src/main/java/com/example/chatgptbridge/MainActivity.java
          grep -q 'x.contains("вниз")' app/src/main/java/com/example/chatgptbridge/MainActivity.java
          grep -q 'compileSdk 35' app/build.gradle
          grep -q 'targetSdk 35' app/build.gradle
          echo "Static FIXED4 checks passed."

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          echo "APK: $APK"
          ls -lh "$APK"
          echo "FIXED4 APK verification passed."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChatGPT-Control-Bridge-v0.1.0-FIXED4-debug-apk
          path: ${{ steps.project.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
