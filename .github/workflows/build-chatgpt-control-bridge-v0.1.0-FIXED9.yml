name: Build ChatGPT Control Bridge APK — FIXED9

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ChatGPT Control Bridge APK FIXED9
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Prepare EXACT FIXED9 source
        id: project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf source
          ZIP="./ChatGPT_Control_Bridge_v0.1.0_FIXED9.zip"
          test -s "$ZIP"
          mkdir -p source
          unzip -q "$ZIP" -d source
          SETTINGS_FILE=$(find source -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) -print -quit)
          test -n "$SETTINGS_FILE"
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          test -f "$PROJECT_DIR/app/src/main/java/com/example/chatgptbridge/MainActivity.java"
          test -f "$PROJECT_DIR/app/src/main/java/com/example/chatgptbridge/BridgeAccessibilityService.java"
          test -f "$PROJECT_DIR/app/src/main/res/xml/accessibility_service_config.xml"
          test -f "$PROJECT_DIR/app/src/main/res/values/strings.xml"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Static FIXED9 checks
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          # Required project identity/version.
          grep -q "rootProject.name='ChatGPT_Control_Bridge_v0.1.0_FIXED9'" settings.gradle
          grep -q "versionName '0.1.0-FIXED9'" app/build.gradle
          grep -q 'versionCode 8' app/build.gradle
          grep -q 'compileSdk 35' app/build.gradle
          grep -q 'targetSdk 35' app/build.gradle

          # Android app/service structure.
          grep -q 'com.openai.chatgpt' app/src/main/java/com/example/chatgptbridge/MainActivity.java
          grep -q 'com.openai.chatgpt' app/src/main/java/com/example/chatgptbridge/BridgeAccessibilityService.java
          grep -q 'android.permission.BIND_ACCESSIBILITY_SERVICE' app/src/main/AndroidManifest.xml
          grep -q 'android.accessibilityservice.AccessibilityService' app/src/main/AndroidManifest.xml
          grep -q '@xml/accessibility_service_config' app/src/main/AndroidManifest.xml

          # Correct accessibility XML: description must be a string resource.
          grep -q 'flagRetrieveInteractiveWindows' app/src/main/res/xml/accessibility_service_config.xml
          grep -q 'flagReportViewIds' app/src/main/res/xml/accessibility_service_config.xml
          grep -q '@string/accessibility_service_description' app/src/main/res/xml/accessibility_service_config.xml
          ! grep -q 'android:description="Локальный' app/src/main/res/xml/accessibility_service_config.xml
          grep -q 'accessibility_service_description' app/src/main/res/values/strings.xml

          # FIXED8 regressions must not remain.
          ! grep -R -q 'FIXED7\|FIXED8' --exclude='*.zip' .

          # Target-window logic and app launching must exist.
          grep -q 'getTargetRoot' app/src/main/java/com/example/chatgptbridge/BridgeAccessibilityService.java
          grep -q 'getWindows' app/src/main/java/com/example/chatgptbridge/BridgeAccessibilityService.java
          grep -q 'getLaunchIntentForPackage' app/src/main/java/com/example/chatgptbridge/MainActivity.java
          grep -q 'getLaunchIntentForPackage' app/src/main/java/com/example/chatgptbridge/BridgeAccessibilityService.java
          grep -q 'findCalculatorPackage' app/src/main/java/com/example/chatgptbridge/BridgeAccessibilityService.java

          echo "Static FIXED9 checks passed."

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          file "$APK"
          ls -lh "$APK"
          echo "FIXED9 APK verification passed."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChatGPT-Control-Bridge-v0.1.0-FIXED9-debug-apk
          path: ${{ steps.project.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
