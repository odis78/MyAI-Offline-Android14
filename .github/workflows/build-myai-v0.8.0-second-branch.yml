name: Build MyAI realme 8 v0.8 — Вторая ветка

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Find and unpack Вторая ветка source
        shell: bash
        run: |
          set -e
          ZIP="./MyAI_Offline_realme8_v0.8.0_NEURAL_VOICE_SECOND_BRANCH.zip"
          if [ ! -f "$ZIP" ]; then
            echo "Source ZIP not found: $ZIP"
            echo "Files in repository root:"
            ls -la
            exit 1
          fi
          rm -rf project
          mkdir -p project
          unzip -q "$ZIP" -d project
          PROJECT_DIR="$(find project -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Using project: $PROJECT_DIR"

      - name: Verify v0.8 source — Вторая ветка
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e
          grep -q 'versionCode = 800' app/build.gradle.kts
          grep -q 'sherpa-onnx:sherpa-onnx:v1.13.8' app/build.gradle.kts
          grep -q 'commons-compress:1.28.0' app/build.gradle.kts
          grep -q 'https://jitpack.io' settings.gradle.kts
          test -f app/src/main/java/com/dmitry/myai/NeuralVoiceManager.kt
          test -f app/src/main/java/com/dmitry/myai/NeuralTtsController.kt
          test -f app/src/main/java/com/dmitry/myai/RealmePerformanceProfile.kt
          echo "v0.8 Вторая ветка source verification passed"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 34
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Build APK — Вторая ветка
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e
          gradle :app:assembleDebug --stacktrace

      - name: Upload APK — Вторая ветка
        uses: actions/upload-artifact@v4
        with:
          name: MyAI-realme8-v0.8-second-branch-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
