name: Build MyAI realme 8 v0.8 — Вторая ветка

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and unpack Second Branch source
        shell: bash
        run: |
          set -e
          ZIP="./MyAI_Offline_realme8_v0.8.0_NEURAL_VOICE_SECOND_BRANCH.zip"
          test -f "$ZIP" || { echo "Source ZIP not found: $ZIP"; exit 1; }
          rm -rf source
          mkdir source
          unzip -q "$ZIP" -d source
          test -f source/myai69/app/build.gradle.kts
          test -f source/myai69/app/src/main/java/com/dmitry/myai/LlamaEngine.kt
          test -f source/myai69/app/src/main/java/com/dmitry/myai/GgufModelManager.kt

      - name: Verify v0.8 Second Branch source
        shell: bash
        run: |
          set -e
          cd source/myai69
          grep -q 'versionCode = 800' app/build.gradle.kts
          grep -q 'versionName = "0.8.0-neural-voice-realme8"' app/build.gradle.kts
          grep -q 'dev.ffmpegkit-maintained:llama-android:0.1.1' app/build.gradle.kts
          grep -q 'tokensPerSecond' app/src/main/java/com/dmitry/myai/LlamaEngine.kt
          ./sanity_check.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 34
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Build APK
        shell: bash
        run: |
          set -e
          cd source/myai69
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyAI-v0.8.0-Second-Branch-debug
          path: source/myai69/app/build/outputs/apk/debug/app-debug.apk
