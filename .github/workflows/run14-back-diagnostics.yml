name: Run 15 - External App Back-Stack Regression

on:
  push:
    branches:
      - diagnostic/back-task-stack-fix
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Static checks and diagnostic APK build
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout isolated diagnostic branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          # setup-android@v4 already accepts SDK licenses. Do not pipe `yes`
          # into sdkmanager: it exits early after accepting licenses, causing
          # `yes` to receive SIGPIPE and fail under `set -o pipefail`.
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Run source sanity checks
        shell: bash
        run: bash MyAI_Infinix_v0.1.0_ALPHA/sanity_check.sh

      - name: Build diagnostic debug APK
        working-directory: MyAI_Infinix_v0.1.0_ALPHA
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Upload diagnostic APK for isolated emulator jobs
        uses: actions/upload-artifact@v4
        with:
          name: myai-run15-debug-apk
          path: MyAI_Infinix_v0.1.0_ALPHA/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  control-baseline:
    name: Control A - Settings to MyAI without tool calls
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - name: Checkout diagnostic scripts
        uses: actions/checkout@v4

      - name: Download diagnostic APK
        uses: actions/download-artifact@v4
        with:
          name: myai-run15-debug-apk
          path: run14-apk

      - name: Place APK at expected path
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p MyAI_Infinix_v0.1.0_ALPHA/app/build/outputs/apk/debug
          APK="$(find run14-apk -type f -name app-debug.apk -print -quit)"
          test -n "$APK"
          cp "$APK" MyAI_Infinix_v0.1.0_ALPHA/app/build/outputs/apk/debug/app-debug.apk

      - name: Enable KVM permissions for Android emulator
        shell: bash
        run: |
          set -euo pipefail
          if [[ -e /dev/kvm ]]; then
            echo "KVM device detected; granting runner access"
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
            test -r /dev/kvm
            test -w /dev/kvm
            echo "KVM_DEVICE=available" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "KVM device is not present; emulator runner will fall back to software emulation"
            echo "KVM_DEVICE=unavailable" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Run no-tool control on clean emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 900
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash "$GITHUB_WORKSPACE/.github/scripts/android-emulator-control-baseline.sh"

      - name: Upload control-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: myai-back-run15-control
          path: test-bridge/android-evidence/run14-control/
          if-no-files-found: warn
          retention-days: 30

  tool-smoke:
    name: Control B - Existing tool smoke on a separate clean emulator
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - name: Checkout diagnostic scripts
        uses: actions/checkout@v4

      - name: Download diagnostic APK
        uses: actions/download-artifact@v4
        with:
          name: myai-run15-debug-apk
          path: run14-apk

      - name: Place APK at expected path
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p MyAI_Infinix_v0.1.0_ALPHA/app/build/outputs/apk/debug
          APK="$(find run14-apk -type f -name app-debug.apk -print -quit)"
          test -n "$APK"
          cp "$APK" MyAI_Infinix_v0.1.0_ALPHA/app/build/outputs/apk/debug/app-debug.apk

      - name: Enable KVM permissions for Android emulator
        shell: bash
        run: |
          set -euo pipefail
          if [[ -e /dev/kvm ]]; then
            echo "KVM device detected; granting runner access"
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
            test -r /dev/kvm
            test -w /dev/kvm
            echo "KVM_DEVICE=available" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "KVM device is not present; emulator runner will fall back to software emulation"
            echo "KVM_DEVICE=unavailable" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Run existing tool smoke on separate clean emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 900
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash "$GITHUB_WORKSPACE/.github/scripts/android-emulator-smoke.sh"

      - name: Upload tool-smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: myai-back-run15-tool-smoke
          path: test-bridge/android-evidence/
          if-no-files-found: warn
          retention-days: 30
