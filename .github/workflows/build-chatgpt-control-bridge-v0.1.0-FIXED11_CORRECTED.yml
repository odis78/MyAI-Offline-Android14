name: Build ChatGPT Control Bridge APK — FIXED11 CORRECTED

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ChatGPT Control Bridge APK FIXED11 CORRECTED
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Prepare exact FIXED11 source
        id: project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf source
          ZIP="./ChatGPT_Control_Bridge_v0.1.0_FIXED11_CORRECTED.zip"
          if [ ! -s "$ZIP" ]; then
            echo "ERROR: missing exact source ZIP: $ZIP"
            find . -maxdepth 1 -type f -name 'ChatGPT_Control_Bridge*.zip' -print | sort
            exit 1
          fi
          mkdir -p source
          unzip -q "$ZIP" -d source
          SETTINGS_FILE=$(find source -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) -print -quit)
          test -n "$SETTINGS_FILE"
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          test -f "$PROJECT_DIR/app/build.gradle"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          test -f "$PROJECT_DIR/app/src/main/java/com/example/chatgptbridge/MainActivity.java"
          test -f "$PROJECT_DIR/app/src/main/java/com/example/chatgptbridge/BridgeAccessibilityService.java"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Using source: $PROJECT_DIR"

      - name: Static FIXED11 checks (diagnostic)
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          check(){ grep -q "$2" "$1" || { echo "FAILED CHECK: $2 in $1"; exit 1; }; }
          check app/src/main/java/com/example/chatgptbridge/BridgeAccessibilityService.java 'FIXED11'
          check app/src/main/java/com/example/chatgptbridge/BridgeAccessibilityService.java 'lastTargetPackage'
          check app/src/main/java/com/example/chatgptbridge/BridgeAccessibilityService.java 'isIgnoredWindowPackage'
          check app/src/main/java/com/example/chatgptbridge/BridgeAccessibilityService.java 'com.google.android.inputmethod.latin'
          check app/src/main/java/com/example/chatgptbridge/BridgeAccessibilityService.java 'TARGET ROOT NOT FOUND'
          check app/src/main/java/com/example/chatgptbridge/BridgeAccessibilityService.java 'BACK: no safe target-specific back control'
          check app/src/main/java/com/example/chatgptbridge/MainActivity.java 'R.id.logScroll'
          check app/src/main/java/com/example/chatgptbridge/MainActivity.java 'fullScroll(View.FOCUS_DOWN)'
          check app/src/main/res/layout/activity_main.xml 'android:id="@+id/logScroll"'
          check app/src/main/res/layout/activity_main.xml 'android:layout_height="300dp"'
          check app/build.gradle 'compileSdk 35'
          check app/build.gradle 'targetSdk 35'
          check app/build.gradle 'versionName .0.1.0-FIXED11.'
          grep -q "rootProject.name='ChatGPT_Control_Bridge_v0.1.0_FIXED11'" settings.gradle || { echo 'FAILED CHECK: project name'; exit 1; }
          grep -q 'versionCode 11' app/build.gradle || { echo 'FAILED CHECK: versionCode 11'; exit 1; }
          echo 'Static FIXED11 checks passed.'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChatGPT-Control-Bridge-v0.1.0-FIXED11-debug-apk
          path: ${{ steps.project.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
