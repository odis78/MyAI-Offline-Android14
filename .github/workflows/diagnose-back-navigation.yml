name: Diagnose Infinix Back Navigation

on:
  push:
    branches:
      - fix/back-navigation-diagnostics-run104

permissions:
  contents: read

jobs:
  build-and-smoke:
    name: Build diagnostic APK and capture navigation evidence
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Run source sanity checks
        run: bash MyAI_Infinix_v0.1.0_ALPHA/sanity_check.sh

      - name: Build diagnostic debug APK
        working-directory: MyAI_Infinix_v0.1.0_ALPHA
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Launch diagnostic APK and capture evidence
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 900
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash "$GITHUB_WORKSPACE/.github/scripts/android-emulator-smoke.sh"

      - name: Upload APK and diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: myai-back-navigation-diagnostic-${{ github.run_number }}
          path: |
            MyAI_Infinix_v0.1.0_ALPHA/app/build/outputs/apk/debug/app-debug.apk
            test-bridge/android-evidence/
          if-no-files-found: warn
          retention-days: 14
