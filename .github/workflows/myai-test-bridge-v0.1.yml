name: MyAI Test Bridge v0.1
on:
  workflow_dispatch:
  push:
    branches:
      - myai-test-bridge-v0.1
    paths:
      - 'test-bridge/**'
      - '.github/workflows/myai-test-bridge-v0.1.yml'
      - '.github/scripts/**'
      - 'MyAI_Infinix_v0.1.0_ALPHA/**'

permissions:
  contents: read

jobs:
  simulator-tests:
    name: Browser simulator regression tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: test-bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: test-bridge/package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser tests
        run: npm test
      - name: Upload browser report and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: myai-test-bridge-browser-report
          path: |
            test-bridge/playwright-report/
            test-bridge/test-results/
          if-no-files-found: warn
          retention-days: 14

  android-clean-emulator-baseline:
    name: Clean Android emulator baseline (no MyAI install)
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Capture clean emulator baseline
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 900
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            mkdir -p test-bridge/clean-baseline-evidence
            adb logcat -c >/dev/null 2>&1 || true
            echo "Clean AVD baseline: no MyAI APK is installed or launched in this job."
            sleep 45
            adb logcat -d -b main -b system -b events -b crash -v threadtime -t 12000 > test-bridge/clean-baseline-evidence/logcat-clean-baseline.txt 2>&1 || true
            adb shell dumpsys activity lastanr > test-bridge/clean-baseline-evidence/lastanr-clean-baseline.txt 2>&1 || true
            adb shell dumpsys window windows > test-bridge/clean-baseline-evidence/windows-clean-baseline.txt 2>&1 || true
            adb shell dumpsys activity processes > test-bridge/clean-baseline-evidence/processes-clean-baseline.txt 2>&1 || true
            adb shell dumpsys accessibility > test-bridge/clean-baseline-evidence/accessibility-clean-baseline.txt 2>&1 || true
            adb shell cat /proc/loadavg > test-bridge/clean-baseline-evidence/loadavg-clean-baseline.txt 2>&1 || true
            if grep -Eiq 'ANR in (com[.]android[.]systemui|com[.]android[.]settings|com[.]android[.]phone|system_server)|Application Not Responding: (system|System UI|Settings)' test-bridge/clean-baseline-evidence/logcat-clean-baseline.txt test-bridge/clean-baseline-evidence/windows-clean-baseline.txt test-bridge/clean-baseline-evidence/lastanr-clean-baseline.txt; then echo "System/UI ANR observed on clean emulator without MyAI installed." | tee test-bridge/clean-baseline-evidence/BASELINE_ANR_FOUND.txt; else echo "No known System/UI ANR signature observed during clean 45-second baseline." | tee test-bridge/clean-baseline-evidence/BASELINE_NO_ANR_SIGNATURE.txt; fi
      - name: Upload clean emulator baseline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: myai-test-bridge-clean-emulator-baseline
          path: test-bridge/clean-baseline-evidence/
          if-no-files-found: warn
          retention-days: 14

  android-apk-smoke:
    name: Build and launch Android debug APK
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Run source sanity checks
        run: bash MyAI_Infinix_v0.1.0_ALPHA/sanity_check.sh
      - name: Build debug APK
        working-directory: MyAI_Infinix_v0.1.0_ALPHA
        run: gradle :app:assembleDebug --stacktrace --no-daemon
      - name: Launch app on Android emulator (restore passing run-54 profile)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # Restore the known passing run-54 emulator profile; do not mix API/profile changes with smoke-script fixes.
          api-level: 34
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 900
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash "$GITHUB_WORKSPACE/.github/scripts/android-emulator-smoke.sh"
      - name: Analyze Android failure evidence
        if: always()
        run: |
          python3 test-bridge/diagnose_android_failure.py test-bridge/android-evidence
          cat test-bridge/android-evidence/diagnosis.md
      - name: Upload Android evidence and APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: myai-test-bridge-android-smoke
          path: |
            MyAI_Infinix_v0.1.0_ALPHA/app/build/outputs/apk/debug/app-debug.apk
            test-bridge/android-evidence/
          if-no-files-found: warn
          retention-days: 14
