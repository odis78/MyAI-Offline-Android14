name: MyAI Test Bridge v0.1
on:
  workflow_dispatch:
  push:
    branches:
      - myai-test-bridge-v0.1
    paths:
      - 'test-bridge/**'
      - '.github/workflows/myai-test-bridge-v0.1.yml'
      - 'MyAI_Infinix_v0.1.0_ALPHA/**'

permissions:
  contents: read

jobs:
  simulator-tests:
    name: Browser simulator regression tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: test-bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: test-bridge/package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser tests
        run: npm test
      - name: Upload browser report and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: myai-test-bridge-browser-report
          path: |
            test-bridge/playwright-report/
            test-bridge/test-results/
            test-bridge/test-results/
          if-no-files-found: warn
          retention-days: 14

  android-apk-smoke:
    name: Build and launch Android debug APK
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Create temporary CI signing key for Gradle configuration
        shell: bash
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/myai-test-bridge.jks"
          keytool -genkeypair -noprompt -keystore "$key" -storepass testpassword -keypass testpassword -alias testkey -dname "CN=MyAI Test Bridge, OU=CI, O=OpenAI, L=Test, ST=Test, C=US" -keyalg RSA -keysize 2048 -validity 2
          echo "MYAI_KEYSTORE_PATH=$key" >> "$GITHUB_ENV"
          echo "MYAI_KEYSTORE_PASSWORD=testpassword" >> "$GITHUB_ENV"
          echo "MYAI_KEY_ALIAS=testkey" >> "$GITHUB_ENV"
          echo "MYAI_KEY_PASSWORD=testpassword" >> "$GITHUB_ENV"
      - name: Build debug APK
        working-directory: MyAI_Infinix_v0.1.0_ALPHA
        run: gradle :app:assembleDebug --stacktrace --no-daemon
      - name: Launch app on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            set -eu
            APK="$GITHUB_WORKSPACE/MyAI_Infinix_v0.1.0_ALPHA/build/outputs/apk/debug/app-debug.apk"
            if [ ! -s "$APK" ]; then
              echo "APK not found at expected path. Searching build outputs:"
              find "$GITHUB_WORKSPACE/MyAI_Infinix_v0.1.0_ALPHA" -type f -name "*.apk" -print
              exit 1
            fi
            adb start-server
            adb wait-for-device
            booted=0
            for attempt in $(seq 1 60); do
              value="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\\r" || true)"
              if [ "$value" = "1" ]; then booted=1; break; fi
              sleep 5
            done
            if [ "$booted" -ne 1 ]; then
              echo "Android boot timeout"
              adb devices -l || true
              exit 1
            fi
            adb install -r "$APK"
            adb shell am force-stop com.dmitry.myai.infinix || true
            adb shell am start -W -n com.dmitry.myai.infinix/.MainActivity
            sleep 3
            adb shell dumpsys activity activities | grep -F "com.dmitry.myai.infinix/.MainActivity"
            mkdir -p "$GITHUB_WORKSPACE/test-bridge/android-evidence"
            adb exec-out screencap -p > "$GITHUB_WORKSPACE/test-bridge/android-evidence/android-emulator.png"
            adb logcat -d -t 3000 > "$GITHUB_WORKSPACE/test-bridge/android-evidence/logcat.txt"
      - name: Upload Android evidence and APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: myai-test-bridge-android-smoke
          path: |
            MyAI_Infinix_v0.1.0_ALPHA/build/outputs/apk/debug/app-debug.apk
            test-bridge/android-evidence/
          if-no-files-found: warn
          retention-days: 14
