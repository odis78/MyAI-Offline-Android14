name: Build MyAI realme 8

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Find and unpack realme 8 project
        shell: bash
        run: |
          set -e

          ZIP="./MyAI_Offline_realme8_v0.6.6_FINAL.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ZIP project not found: $ZIP"
            exit 1
          fi

          echo "Found ZIP: $ZIP"

          rm -rf project
          mkdir -p project

          unzip -q "$ZIP" -d project

          PROJECT_DIR="$(find project -mindepth 1 -maxdepth 1 -type d | head -n 1)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "Project directory not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Using project: $PROJECT_DIR"

      - name: Verify manifest
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "=== AndroidManifest.xml ==="
          sed -n '1,80p' app/src/main/AndroidManifest.xml

          if grep -n "uses-native-library" app/src/main/AndroidManifest.xml; then
            echo "ERROR: old uses-native-library entry found"
            exit 1
          fi

          echo "Manifest verification passed."

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 34
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "Checking Android project..."
          ls -lah

          echo "Gradle version:"
          gradle --version

          echo "Building APK..."
          gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyAI-realme8-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
