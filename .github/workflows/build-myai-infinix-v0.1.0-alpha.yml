name: Build MyAI Infinix — Signed Update

on:
  workflow_dispatch:
  push:
    branches:
      - infinix
      - infinix-chatgpt

permissions:
  contents: read

env:
  PROJECT_DIR: MyAI_Infinix_v0.1.0_ALPHA
  APK: MyAI_Infinix_v0.1.0_ALPHA/app/build/outputs/apk/release/app-release.apk
  BUILD_TOOLS: 35.0.0
  EXPECTED_CERT_SHA256: 19:E7:DD:5A:EB:7A:23:52:69:B8:F6:F4:33:F6:8F:1B:E0:F3:C3:BC:1B:14:5B:C2:1F:DB:A5:26:EB:1E:CB:64

jobs:
  build:
    name: Static checks + tests + lint + signed update APK
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify exact source directory
        shell: bash
        run: |
          set -euo pipefail
          test -d "${PROJECT_DIR}"
          test ! -d "My AI_Infinix_v0.1.0_ALPHA"
          test ! -d "MyAI_Infinix_v0.1.0_ALP HA"
          test -f "${PROJECT_DIR}/settings.gradle"
          test -f "${PROJECT_DIR}/build.gradle"
          test -f "${PROJECT_DIR}/app/build.gradle"
          test -f "${PROJECT_DIR}/sanity_check.sh"
          test -f "${PROJECT_DIR}/app/src/main/AndroidManifest.xml"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          set +e
          yes | sdkmanager --licenses
          SDKMANAGER_RC=${PIPESTATUS[1]}
          set -e
          test "${SDKMANAGER_RC}" -eq 0
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$ANDROID_HOME/platform-tools/adb" version

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Verify Gradle
        shell: bash
        run: |
          set -euo pipefail
          gradle --version | tee "${RUNNER_TEMP}/gradle-version.txt"
          grep -Fq "Gradle 8.11.1" "${RUNNER_TEMP}/gradle-version.txt"

      - name: Static source sanity
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x sanity_check.sh
          ./sanity_check.sh

      - name: Verify signing secrets are configured
        shell: bash
        env:
          MYAI_KEYSTORE_B64: ${{ secrets.MYAI_INFINIX_KEYSTORE_B64 }}
          MYAI_KEYSTORE_PASSWORD: ${{ secrets.MYAI_INFINIX_KEYSTORE_PASSWORD }}
          MYAI_KEY_ALIAS: ${{ secrets.MYAI_INFINIX_KEY_ALIAS }}
          MYAI_KEY_PASSWORD: ${{ secrets.MYAI_INFINIX_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${MYAI_KEYSTORE_B64}"
          test -n "${MYAI_KEYSTORE_PASSWORD}"
          test -n "${MYAI_KEY_ALIAS}"
          test -n "${MYAI_KEY_PASSWORD}"
          mkdir -p "${RUNNER_TEMP}/myai-signing"
          printf '%s' "${MYAI_KEYSTORE_B64}" | base64 --decode > "${RUNNER_TEMP}/myai-signing/myai-infinix-release.jks"
          test -s "${RUNNER_TEMP}/myai-signing/myai-infinix-release.jks"
          echo "MYAI_KEYSTORE_PATH=${RUNNER_TEMP}/myai-signing/myai-infinix-release.jks" >> "$GITHUB_ENV"
          echo "MYAI_KEYSTORE_PASSWORD=${MYAI_KEYSTORE_PASSWORD}" >> "$GITHUB_ENV"
          echo "MYAI_KEY_ALIAS=${MYAI_KEY_ALIAS}" >> "$GITHUB_ENV"
          echo "MYAI_KEY_PASSWORD=${MYAI_KEY_PASSWORD}" >> "$GITHUB_ENV"
          chmod 600 "${RUNNER_TEMP}/myai-signing/myai-infinix-release.jks"
          keytool -list -v -keystore "${RUNNER_TEMP}/myai-signing/myai-infinix-release.jks" -storepass "${MYAI_KEYSTORE_PASSWORD}" -alias "${MYAI_KEY_ALIAS}" > "${RUNNER_TEMP}/myai-signing/keystore-details.txt"
          grep -Fq "Entry type: PrivateKeyEntry" "${RUNNER_TEMP}/myai-signing/keystore-details.txt"
          grep -Fq "19:E7:DD:5A:EB:7A:23:52:69:B8:F6:F4:33:F6:8F:1B:E0:F3:C3:BC:1B:14:5B:C2:1F:DB:A5:26:EB:1E:CB:64" "${RUNNER_TEMP}/myai-signing/keystore-details.txt"
          echo "Permanent signing keystore and certificate verified."

      - name: Gradle test
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle test --stacktrace --no-daemon

      - name: Android lint
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle lintRelease --stacktrace --no-daemon

      - name: Build signed release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle :app:assembleRelease --stacktrace --no-daemon

      - name: Verify signed update APK
        shell: bash
        run: |
          set -euo pipefail
          test -s "${APK}"
          BADGING="$( "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/aapt" dump badging "${APK}" )"
          echo "${BADGING}" | grep -Fq "package: name='com.dmitry.myai.infinix'"
          EXPECTED_VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))
          echo "${BADGING}" | grep -Fq "versionCode='${EXPECTED_VERSION_CODE}'"
          echo "${BADGING}" | grep -Fq "versionName='0.1.${GITHUB_RUN_NUMBER}-INFINIX-ALPHA'"
          SIGNING="$( "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apksigner" verify --verbose --print-certs "${APK}" )"
          EXPECTED_CERT_NORMALIZED="$(printf '%s' "${EXPECTED_CERT_SHA256}" | tr '[:upper:]' '[:lower:]' | tr -d ':')"
          ACTUAL_CERT_NORMALIZED="$(printf '%s\\n' "${SIGNING}" | grep -iF 'Signer #1 certificate SHA-256 digest:' | head -n 1 | sed 's/.*digest: //' | tr -d ':\\r' | tr '[:upper:]' '[:lower:]')"
          echo "APK certificate SHA-256: ${ACTUAL_CERT_NORMALIZED}"
          test -n "${ACTUAL_CERT_NORMALIZED}"
          test "${ACTUAL_CERT_NORMALIZED}" = "${EXPECTED_CERT_NORMALIZED}"
          if echo "${SIGNING}" | grep -Fq "CN=Android Debug"; then
            echo "Debug certificate detected; refusing to publish update APK."
            exit 1
          fi
          "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apksigner" verify --verbose "${APK}"
          sha256sum "${APK}" | tee "${APK}.sha256"
          SIZE_BYTES=$(stat -c '%s' "${APK}")
          if [ "${SIZE_BYTES}" -gt 52428800 ]; then echo "::warning::APK is larger than 50 MiB"; fi

      - name: Upload signed update artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MyAI-Infinix-signed-update-build-${{ github.run_number }}
          path: |
            ${{ env.APK }}
            ${{ env.APK }}.sha256
            MyAI_Infinix_v0.1.0_ALPHA/app/build/reports/lint-results-release.html
          if-no-files-found: error
          retention-days: 30
