name: Build MyAI Infinix — ChatGPT + Control Bridge + Agent FIXED
# CI trigger: rebuild after static fixes
# FIXED-14 UI scroll + Accessibility status validation
# FIXED-5 validation build

on:
  workflow_dispatch:
  push:
    branches:
      - infinix-agent-fixed
  pull_request:
    branches:
      - infinix-chatgpt

permissions:
  contents: read

env:
  PROJECT_DIR: MyAI_Infinix_v0.1.0_ALPHA
  APK: MyAI_Infinix_v0.1.0_ALPHA/app/build/outputs/apk/release/app-release.apk
  BUILD_TOOLS: 35.0.0
  EXPECTED_CERT_SHA256: 19:E7:DD:5A:EB:7A:23:52:69:B8:F6:F4:33:F6:8F:1B:E0:F3:C3:BC:1B:14:5B:C2:1F:DB:A5:26:EB:1E:CB:64

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Strict source check
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/dmitry/myai/infinix/MainActivity.java
          test -f app/src/main/java/com/dmitry/myai/infinix/GatewayActivity.java
          test -f app/src/main/java/com/dmitry/myai/infinix/online/HttpOnlineGateway.java
          test -f app/src/main/java/com/dmitry/myai/infinix/bridge/MyAiAccessibilityService.java
          test -f app/src/main/java/com/dmitry/myai/infinix/tools/ToolProtocol.java
          test -f app/src/main/java/com/dmitry/myai/infinix/tools/ToolExecutor.java
          test -f app/src/main/java/com/dmitry/myai/infinix/safety/PolicyGate.java
          test -f app/src/main/java/com/dmitry/myai/infinix/verification/VerificationEngine.java
          grep -Fq 'com.openai.chatgpt' app/src/main/java/com/dmitry/myai/infinix/MainActivity.java
          grep -Fq 'GatewayActivity' app/src/main/java/com/dmitry/myai/infinix/MainActivity.java
          grep -Fq 'performGlobalAction(GLOBAL_ACTION_BACK)' app/src/main/java/com/dmitry/myai/infinix/bridge/MyAiAccessibilityService.java
          grep -Fq 'performGlobalAction(GLOBAL_ACTION_HOME)' app/src/main/java/com/dmitry/myai/infinix/bridge/MyAiAccessibilityService.java
          grep -Fq 'dispatchGesture' app/src/main/java/com/dmitry/myai/infinix/bridge/MyAiAccessibilityService.java
          grep -Fq 'android.permission.BIND_ACCESSIBILITY_SERVICE' app/src/main/AndroidManifest.xml
          echo "SOURCE CHECK PASSED"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: android-actions/setup-android@v4

      - name: Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Prepare signing
        shell: bash
        env:
          KS_B64: ${{ secrets.MYAI_INFINIX_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.MYAI_INFINIX_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.MYAI_INFINIX_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.MYAI_INFINIX_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KS_B64"
          test -n "$KS_PASS"
          test -n "$KS_ALIAS"
          test -n "$KEY_PASS"
          mkdir -p "$RUNNER_TEMP/myai-signing"
          printf '%s' "$KS_B64" | base64 --decode > "$RUNNER_TEMP/myai-signing/myai-infinix-release.jks"
          echo "MYAI_KEYSTORE_PATH=$RUNNER_TEMP/myai-signing/myai-infinix-release.jks" >> "$GITHUB_ENV"
          echo "MYAI_KEYSTORE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
          echo "MYAI_KEY_ALIAS=$KS_ALIAS" >> "$GITHUB_ENV"
          echo "MYAI_KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"

      - name: Tests
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle test --stacktrace --no-daemon

      - name: Lint
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle lintRelease --stacktrace --no-daemon

      - name: Build signed APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle :app:assembleRelease --stacktrace --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          test -s "$APK"
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" verify --verbose "$APK"
          BADGING="$("$ANDROID_HOME/build-tools/$BUILD_TOOLS/aapt" dump badging "$APK")"
          echo "$BADGING" | grep -Fq "package: name='com.dmitry.myai.infinix'"
          SIGNING="$("$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK")"
          EXPECTED="$(printf '%s' "$EXPECTED_CERT_SHA256" | tr '[:upper:]' '[:lower:]' | tr -d ':')"
          ACTUAL="$(printf '%s\n' "$SIGNING" | grep -iF 'Signer #1 certificate SHA-256 digest:' | head -n1 | sed 's/.*digest: //' | tr -d ':\r' | tr '[:upper:]' '[:lower:]')"
          test "$ACTUAL" = "$EXPECTED"
          sha256sum "$APK" | tee "$APK.sha256"

      - name: Upload final artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MyAI-Infinix-ChatGPT-ControlBridge-Agent-FIXED-${{ github.run_number }}
          path: |
            ${{ env.APK }}
            ${{ env.APK }}.sha256
            MyAI_Infinix_v0.1.0_ALPHA/app/build/reports/lint-results-release.html
          if-no-files-found: error
          retention-days: 30

