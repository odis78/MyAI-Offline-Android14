name: Build ChatGPT Control Bridge APK — FIXED11

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ChatGPT Control Bridge APK FIXED11
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Prepare EXACT FIXED11 source
        id: project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf source
          ZIP="./ChatGPT_Control_Bridge_v0.1.0_FIXED11.zip"
          test -s "$ZIP"
          unzip -tq "$ZIP"
          mkdir -p source
          unzip -q "$ZIP" -d source
          SETTINGS_FILE=$(find source -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) -print -quit)
          test -n "$SETTINGS_FILE"
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          test -f "$PROJECT_DIR/app/src/main/java/com/example/chatgptbridge/MainActivity.java"
          test -f "$PROJECT_DIR/app/src/main/java/com/example/chatgptbridge/BridgeAccessibilityService.java"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
      - name: Static FIXED11 checks
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'FIXED11' app/src/main/java/com/example/chatgptbridge/BridgeAccessibilityService.java
          grep -q 'lastTargetPackage' app/src/main/java/com/example/chatgptbridge/BridgeAccessibilityService.java
          grep -q 'isIgnoredWindowPackage' app/src/main/java/com/example/chatgptbridge/BridgeAccessibilityService.java
          grep -q 'resolveTargetPackage' app/src/main/java/com/example/chatgptbridge/BridgeAccessibilityService.java
          grep -q 'com.coloros.smartsidebar' app/src/main/java/com/example/chatgptbridge/BridgeAccessibilityService.java
          grep -q 'com.oplus.leftscreen' app/src/main/java/com/example/chatgptbridge/BridgeAccessibilityService.java
          grep -q 'com.google.android.inputmethod.latin' app/src/main/java/com/example/chatgptbridge/BridgeAccessibilityService.java
          grep -q 'TARGET ROOT NOT FOUND' app/src/main/java/com/example/chatgptbridge/BridgeAccessibilityService.java
          grep -q 'BACK: Bridge is foreground; no unsafe GLOBAL_BACK' app/src/main/java/com/example/chatgptbridge/BridgeAccessibilityService.java
          ! grep -q 'ACTION BACK AFTER FOCUS' app/src/main/java/com/example/chatgptbridge/BridgeAccessibilityService.java
          grep -q 'R.id.logScroll' app/src/main/java/com/example/chatgptbridge/MainActivity.java
          grep -q 'fullScroll(View.FOCUS_DOWN)' app/src/main/java/com/example/chatgptbridge/MainActivity.java
          grep -q 'android:id="@+id/logScroll"' app/src/main/res/layout/activity_main.xml
          grep -q 'android:layout_height="300dp"' app/src/main/res/layout/activity_main.xml
          grep -q 'compileSdk 35' app/build.gradle
          grep -q 'targetSdk 35' app/build.gradle
          grep -q 'versionName.*FIXED11' app/build.gradle
          grep -q 'versionCode 11' app/build.gradle
          grep -q "rootProject.name='ChatGPT_Control_Bridge_v0.1.0_FIXED11'" settings.gradle
          echo "Static FIXED11 checks passed."
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --stacktrace --no-daemon
      - name: Verify APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChatGPT-Control-Bridge-v0.1.0-FIXED11-debug-apk
          path: ${{ steps.project.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
