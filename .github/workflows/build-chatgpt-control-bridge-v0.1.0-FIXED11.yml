name: Build ChatGPT Control Bridge APK — FIXED11 FINAL

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ChatGPT Control Bridge APK FIXED11 FINAL
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Verify and prepare EXACT FIXED11 FINAL source
        id: project
        shell: bash
        run: |
          set -euo pipefail

          ZIP="./ChatGPT_Control_Bridge_v0.1.0_FIXED11.zip"
          EXPECTED_SHA256="92ea07c2ea8567424a79a1f08e0fa45eb8f6c0a43c417dc8002b64bfc60838d9"
          BUILD_ID="FIXED11-CAMERA-GALLERY-20261002-FINAL"

          test -s "$ZIP"
          ACTUAL_SHA256="$(sha256sum "$ZIP" | awk '{print $1}')"
          echo "FIXED11 FINAL ZIP SHA256: $ACTUAL_SHA256"

          if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "::error::Wrong ChatGPT_Control_Bridge_v0.1.0_FIXED11.zip is present in the repository."
            echo "::error::Expected SHA256: $EXPECTED_SHA256"
            echo "::error::Actual SHA256:   $ACTUAL_SHA256"
            exit 1
          fi

          rm -rf source
          mkdir -p source
          unzip -q "$ZIP" -d source

          SETTINGS_FILE="$(find source -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) -print -quit)"
          test -n "$SETTINGS_FILE"
          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          test -f "$PROJECT_DIR/app/src/main/java/com/example/chatgptbridge/MainActivity.java"
          test -f "$PROJECT_DIR/app/src/main/java/com/example/chatgptbridge/BridgeAccessibilityService.java"

      - name: Static FINAL FIXED11 checks
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          SERVICE="app/src/main/java/com/example/chatgptbridge/BridgeAccessibilityService.java"
          MANIFEST="app/src/main/AndroidManifest.xml"
          BUILD="app/build.gradle"
          BUILD_ID="FIXED11-CAMERA-GALLERY-20261002-FINAL"

          grep -q "rootProject.name='ChatGPT_Control_Bridge_v0.1.0_FIXED11'" settings.gradle
          grep -q "versionName '0.1.0-FIXED11'" "$BUILD"
          grep -q 'versionCode 11' "$BUILD"
          grep -q 'compileSdk 35' "$BUILD"
          grep -q 'targetSdk 35' "$BUILD"

          grep -q 'FIXED11-CAMERA-GALLERY-20261002-FINAL' "$SERVICE"
          grep -q 'SERVICE CONNECTED ' "$SERVICE"

          grep -q 'android.permission.BIND_ACCESSIBILITY_SERVICE' "$MANIFEST"
          grep -q 'android.accessibilityservice.AccessibilityService' "$MANIFEST"
          grep -q 'com.android.camera' "$MANIFEST"
          grep -q 'com.oppo.camera' "$MANIFEST"
          grep -q 'com.coloros.gallery3d' "$MANIFEST"
          grep -q 'com.google.android.apps.photos' "$MANIFEST"

          grep -q 'handleSystemAppCommand(name)' "$SERVICE"
          grep -q 'log("SYSTEM CMD try:' "$SERVICE"
          grep -q 'n.contains("камер")' "$SERVICE"
          grep -q 'n.contains("галере")' "$SERVICE"
          grep -q 'MediaStore.INTENT_ACTION_STILL_IMAGE_CAMERA' "$SERVICE"
          grep -q 'MediaStore.ACTION_IMAGE_CAPTURE' "$SERVICE"
          grep -q 'Intent.CATEGORY_APP_GALLERY' "$SERVICE"
          grep -q 'MediaStore.Images.Media.EXTERNAL_CONTENT_URI' "$SERVICE"
          grep -q 'Intent.ACTION_OPEN_DOCUMENT' "$SERVICE"
          grep -q 'tryExplicitPackages' "$SERVICE"
          grep -q 'SYSTEM OPEN RESOLVED' "$SERVICE"
          grep -q 'SYSTEM OPEN NO HANDLER' "$SERVICE"
          grep -q 'CAMERA FALLBACK PACKAGE' "$SERVICE"
          grep -q 'GALLERY FALLBACK PACKAGE' "$SERVICE"

          grep -q 'private boolean clickMicrophone' "$SERVICE"
          grep -q 'findMicrophoneNode' "$SERVICE"
          grep -q 'performGlobalAction(GLOBAL_ACTION_BACK)' "$SERVICE"
          grep -q 'dispatchGesture' "$SERVICE"
          grep -q 'открыть файл' "$SERVICE"
          grep -q 'R.id.logScroll' app/src/main/java/com/example/chatgptbridge/MainActivity.java

          echo "Static FINAL FIXED11 checks passed."
          echo "BUILD_ID=$BUILD_ID"

      - name: XML and Java source sanity checks
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as ET

          root = pathlib.Path('.')
          xml_files = [
              root/'app/src/main/AndroidManifest.xml',
              root/'app/src/main/res/xml/accessibility_service_config.xml',
              root/'app/src/main/res/values/strings.xml',
              root/'app/src/main/res/values/styles.xml',
              root/'app/src/main/res/layout/activity_main.xml',
          ]
          for p in xml_files:
              ET.parse(p)

          java_files = [
              root/'app/src/main/java/com/example/chatgptbridge/MainActivity.java',
              root/'app/src/main/java/com/example/chatgptbridge/BridgeAccessibilityService.java',
          ]
          for p in java_files:
              s = p.read_text(encoding='utf-8')
              if s.count('{') != s.count('}'):
                  raise SystemExit(f'Unbalanced braces: {p}')
          print('XML and Java source sanity checks passed.')
          PY

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify FINAL APK
        id: apk
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          BUILD_ID="FIXED11-CAMERA-GALLERY-20261002-FINAL"

          test -s "$APK"
          echo "APK SHA256: $(sha256sum "$APK" | awk '{print $1}')"
          sha256sum "$APK" > app-debug.apk.sha256

          echo "--- APK manifest ---"
          "$AAPT" dump badging "$APK" | grep -E "package:|versionCode|versionName" | head -1
          "$AAPT" dump badging "$APK" | grep -q "package: name='com.example.chatgptbridge'"
          "$AAPT" dump badging "$APK" | grep -q "versionCode='11'"
          "$AAPT" dump badging "$APK" | grep -q "versionName='0.1.0-FIXED11'"

          echo "--- APK signature ---"
          "$APKSIGNER" verify --verbose "$APK"

          echo "--- APK BUILD_ID ---"
          FOUND=0
          for dex in $(unzip -Z1 "$APK" | grep -E '^classes([0-9]+)?\\.dex$'); do
            if unzip -p "$APK" "$dex" | strings | grep -Fq "$BUILD_ID"; then
              FOUND=1
              break
            fi
          done
          if [ "$FOUND" -ne 1 ]; then
            echo "::error::BUILD_ID was not found inside the generated APK dex files."
            exit 1
          fi
          echo "BUILD_ID verified inside APK: $BUILD_ID"

          echo "FINAL APK verification passed."

      - name: Upload FINAL APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: ChatGPT-Control-Bridge-v0.1.0-FIXED11-FINAL-debug-apk
          path: |
            ${{ steps.project.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk
            ${{ steps.project.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
