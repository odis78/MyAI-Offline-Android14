name: Build ChatGPT Control Bridge APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ChatGPT Control Bridge APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Detect Android SDK
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_SDK_ROOT:-}" ] && [ -n "${ANDROID_HOME:-}" ]; then
            export ANDROID_SDK_ROOT="$ANDROID_HOME"
          fi
          if [ -z "${ANDROID_SDK_ROOT:-}" ] && [ -d "/usr/local/lib/android/sdk" ]; then
            export ANDROID_SDK_ROOT="/usr/local/lib/android/sdk"
          fi
          if [ -z "${ANDROID_SDK_ROOT:-}" ]; then
            echo "Android SDK was not found on the runner."
            exit 1
          fi
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          if [ -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          elif command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          else
            echo "sdkmanager was not found."
            exit 1
          fi
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "Android SDK: $ANDROID_SDK_ROOT"
          echo "sdkmanager: $SDKMANAGER"
          "$SDKMANAGER" --version

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" --licenses >/dev/null 2>&1 || true

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail
          test -d "$ANDROID_SDK_ROOT/platforms/android-35"
          test -d "$ANDROID_SDK_ROOT/build-tools/35.0.0"
          "$ANDROID_SDK_ROOT/platform-tools/adb" version

      - name: Prepare Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf source

          # The repository may contain the project directly or as the project ZIP.
          if [ -f "settings.gradle" ] || [ -f "settings.gradle.kts" ]; then
            PROJECT_DIR="."
          else
            ZIP=""
            for candidate in \
              ./ChatGPT_Control_Bridge_v0.1.0*.zip \
              ./ChatGPT_Control_Bridge*.zip; do
              if [ -f "$candidate" ]; then
                ZIP="$candidate"
                break
              fi
            done

            if [ -z "$ZIP" ]; then
              echo "ChatGPT Control Bridge project was not found."
              echo "Repository root:"
              find . -maxdepth 2 -type f -print | sort
              exit 1
            fi

            echo "Using source ZIP: $ZIP"
            mkdir -p source
            unzip -q "$ZIP" -d source

            SETTINGS_FILE=$(find source -maxdepth 5 -type f -name 'settings.gradle' -print -quit)
            if [ -z "$SETTINGS_FILE" ]; then
              SETTINGS_FILE=$(find source -maxdepth 5 -type f -name 'settings.gradle.kts' -print -quit)
            fi
            if [ -z "$SETTINGS_FILE" ]; then
              echo "The ZIP does not contain a Gradle Android project."
              find source -maxdepth 6 -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' -o -name 'build.gradle' -o -name 'build.gradle.kts' \) -print
              exit 1
            fi
            PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          fi

          PROJECT_DIR="${PROJECT_DIR#./}"
          if [ -z "$PROJECT_DIR" ]; then PROJECT_DIR="."; fi
          test -f "$PROJECT_DIR/settings.gradle" || test -f "$PROJECT_DIR/settings.gradle.kts"
          test -f "$PROJECT_DIR/app/build.gradle" || test -f "$PROJECT_DIR/app/build.gradle.kts"
          echo "Android project: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Static project checks
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/example/chatgptbridge/MainActivity.java
          test -f app/src/main/java/com/example/chatgptbridge/BridgeAccessibilityService.java
          grep -q 'com.openai.chatgpt' app/src/main/AndroidManifest.xml
          grep -q "compileSdk 35" app/build.gradle
          grep -q "targetSdk 35" app/build.gradle
          grep -q "com.android.application.*8.9.2" ../build.gradle || grep -q "com.android.application.*8.9.2" build.gradle
          echo "Static project checks passed."

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"
          echo "APK build and verification passed."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChatGPT-Control-Bridge-v0.1.0-debug-apk
          path: ${{ steps.project.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
