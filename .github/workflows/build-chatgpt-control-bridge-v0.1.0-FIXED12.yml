name: Build ChatGPT Control Bridge APK — FIXED12 FINAL

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ChatGPT Control Bridge APK FIXED12 FINAL
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Verify and prepare EXACT FIXED12 source
        id: project
        shell: bash
        run: |
          set -euo pipefail
          ZIP="./ChatGPT_Control_Bridge_v0.1.0_FIXED12.zip"
          test -s "$ZIP"
          ACTUAL_SHA256="$(sha256sum "$ZIP" | awk '{print $1}')"
          echo "FIXED12 ZIP SHA256: $ACTUAL_SHA256"
          rm -rf source
          mkdir -p source
          unzip -q "$ZIP" -d source
          SETTINGS_FILE="$(find source -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) -print -quit)"
          test -n "$SETTINGS_FILE"
          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          test -f "$PROJECT_DIR/app/src/main/res/xml/accessibility_service_config.xml"
          test -f "$PROJECT_DIR/app/src/main/java/com/example/chatgptbridge/MainActivity.java"
          test -f "$PROJECT_DIR/app/src/main/java/com/example/chatgptbridge/BridgeAccessibilityService.java"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "[OK] ZIP and source preparation"

      - name: Static FINAL FIXED12 checks
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          SERVICE="app/src/main/java/com/example/chatgptbridge/BridgeAccessibilityService.java"
          MAIN="app/src/main/java/com/example/chatgptbridge/MainActivity.java"
          MANIFEST="app/src/main/AndroidManifest.xml"
          CONFIG="app/src/main/res/xml/accessibility_service_config.xml"
          BUILD="app/build.gradle"
          SETTINGS="settings.gradle"
          BUILD_ID="FIXED12-COMMAND-PARSER-20261002-FINAL"
          check(){ local label="$1" file="$2" needle="$3"; if grep -Fq "$needle" "$file"; then echo "[OK] $label"; else echo "::error::[FAIL] $label"; echo "Missing text: $needle"; echo "File: $file"; exit 1; fi; }
          check "project name" "$SETTINGS" "rootProject.name='ChatGPT_Control_Bridge_v0.1.0_FIXED12'"
          check "versionName" "$BUILD" "versionName '0.1.0-FIXED12'"
          check "versionCode 12" "$BUILD" "versionCode 12"
          check "compileSdk 35" "$BUILD" "compileSdk 35"
          check "targetSdk 35" "$BUILD" "targetSdk 35"
          check "BUILD_ID" "$SERVICE" "$BUILD_ID"
          check "AccessibilityService" "$MANIFEST" "android.accessibilityservice.AccessibilityService"
          check "BIND_ACCESSIBILITY_SERVICE" "$MANIFEST" "android.permission.BIND_ACCESSIBILITY_SERVICE"
          check "retrieve window content" "$CONFIG" 'android:canRetrieveWindowContent="true"'
          check "perform gestures" "$CONFIG" 'android:canPerformGestures="true"'
          check "interactive windows" "$CONFIG" 'flagRetrieveInteractiveWindows'
          check "camera matching" "$SERVICE" 'n.contains("камер")'
          check "gallery matching" "$SERVICE" 'n.contains("галере")'
          check "camera intent" "$SERVICE" 'MediaStore.INTENT_ACTION_STILL_IMAGE_CAMERA'
          check "gallery intent" "$SERVICE" 'Intent.CATEGORY_APP_GALLERY'
          check "scroll phrase up" "$SERVICE" 'x.equals("прокрутить вверх")'
          check "scroll phrase down" "$SERVICE" 'x.equals("прокрутить вниз")'
          check "text payload parser" "$SERVICE" 'extractTextCommandPayload'
          check "text parser removes prefix" "$SERVICE" 'ввести текста '
          check "dial command parser" "$SERVICE" 'набрать номер '
          check "dial number extractor" "$SERVICE" 'extractDialNumber'
          check "dial intent" "$SERVICE" 'Intent.ACTION_DIAL'
          check "microphone" "$SERVICE" 'private boolean clickMicrophone'
          check "global BACK" "$SERVICE" 'performGlobalAction(GLOBAL_ACTION_BACK)'
          check "file command" "$SERVICE" 'открыть файл'
          check "log scroll" "$MAIN" 'R.id.logScroll'
          echo "[OK] Static FIXED12 checks passed"

      - name: XML and Java source sanity checks
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          root=pathlib.Path('.')
          for p in [root/'app/src/main/AndroidManifest.xml',root/'app/src/main/res/xml/accessibility_service_config.xml',root/'app/src/main/res/values/strings.xml',root/'app/src/main/res/values/styles.xml',root/'app/src/main/res/layout/activity_main.xml']:
              ET.parse(p)
          for p in [root/'app/src/main/java/com/example/chatgptbridge/MainActivity.java',root/'app/src/main/java/com/example/chatgptbridge/BridgeAccessibilityService.java']:
              s=p.read_text(encoding='utf-8')
              if s.count('{')!=s.count('}'):
                  raise SystemExit(f'Unbalanced braces: {p}')
          print('[OK] XML and Java sanity')
          PY

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify FINAL APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          BUILD_ID="FIXED12-COMMAND-PARSER-20261002-FINAL"
          test -s "$APK"
          sha256sum "$APK" | tee app-debug.apk.sha256
          "$AAPT" dump badging "$APK" | grep -q "package: name='com.example.chatgptbridge'"
          "$AAPT" dump badging "$APK" | grep -q "versionCode='12'"
          "$AAPT" dump badging "$APK" | grep -q "versionName='0.1.0-FIXED12'"
          echo "[OK] APK package/version"
          "$APKSIGNER" verify --verbose "$APK"
          echo "[OK] APK signature"
          FOUND=0
          while IFS= read -r dex; do
            if unzip -p "$APK" "$dex" | strings | grep -Fq "$BUILD_ID"; then FOUND=1; break; fi
          done < <(unzip -Z1 "$APK" | grep -E '^classes([0-9]+)?\.dex$')
          test "$FOUND" -eq 1
          echo "[OK] BUILD_ID inside APK: $BUILD_ID"

      - name: Upload FINAL APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: ChatGPT-Control-Bridge-v0.1.0-FIXED12-FINAL-debug-apk
          path: |
            ${{ steps.project.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk
            ${{ steps.project.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
